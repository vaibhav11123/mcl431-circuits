name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Pack tests
        run: pytest tests/test_iso_pack.py tests/test_service.py tests/test_provenance.py -q
      - name: Eval goldens
        run: python -m circuit eval --goldens
