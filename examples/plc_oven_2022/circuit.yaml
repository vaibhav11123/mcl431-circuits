meta:
  title: 2022 Major Q1 oven with SLOW/FAST AO
  domain: plc
  exam_id: 2022_major_q1_oven_ao
  patterns: []

sequence: []
power: { pumps: [], tank: "" }
cylinders: {}
motors: {}
valves: {}
sensors: [S1, S2, A, B]
electrical: { convention: plc, paths: [] }

plc:
  subtitle_connection: "PLC connection  ·  oven AO 2/8 kW"
  subtitle_ladder: "PLC ladder  ·  bands + MOV AO + display TON 5 s"
  notes:
    - "S2 selects SLOW/FAST. Band latch as 2017. MOV AO 819/3276. TON 5 s then MOV to N7:1."
  io:
    - { address: I0.0, device: S1, function: "System ON" }
    - { address: I0.1, device: S2, function: "SLOW/FAST (NO=FAST)" }
    - { address: I0.2, device: A, function: "Select 600 F" }
    - { address: I0.3, device: B, function: "Select 800 F" }
    - { address: "AI Slot-2", device: Temp, function: "0–1023 F 10-bit" }
    - { address: "AO Slot-3 Ch-2", device: HeaterPWR, function: "0–10 V 12-bit" }
    - { address: Q0.0, device: HEATER_EN, function: "Heater enable" }
  field:
    - title: Power
      lines: ["SLOW 2 kW AO 819", "FAST 8 kW AO 3276", "N7:1 every 5 s"]
  scaling:
    ai: { eng_max: 1023, bits: 10, slot: 2, unit: F }
    ao: { eng_max: 10, bits: 12, slot: 3, channel: 2, unit: V }
    checkpoints: { ai_597: 597, ai_603: 603, ai_796: 796, ai_804: 804, ao_2kw: 2, ao_8kw: 8 }
    counts: { ao_2kw: 819, ao_8kw: 3276 }
  rungs:
    - id: 1
      caption: Select 600
      series:
        - { kind: contact, tag: I0.2, label: "I0.2 A", sense: "NO" }
      output: { kind: otl, tag: M0.1, label: "M0.1 SP600" }
    - id: 2
      caption: Clear 600
      series:
        - { kind: contact, tag: I0.3, label: "I0.3 B", sense: "NO" }
      output: { kind: otu, tag: M0.1, label: "M0.1 SP600" }
    - id: 3
      caption: Select 800
      series:
        - { kind: contact, tag: I0.3, label: "I0.3 B", sense: "NO" }
      output: { kind: otl, tag: M0.2, label: "M0.2 SP800" }
    - id: 4
      caption: Clear 800
      series:
        - { kind: contact, tag: I0.2, label: "I0.2 A", sense: "NO" }
      output: { kind: otu, tag: M0.2, label: "M0.2 SP800" }
    - id: 5
      caption: "600 latch heater low"
      series:
        - { kind: contact, tag: I0.0, label: "I0.0 S1", sense: "NO" }
        - { kind: contact, tag: M0.1, label: "M0.1 SP600", sense: "NO" }
        - { kind: cmp, op: "≤", left: AI, right_from: ai_597 }
      output: { kind: otl, tag: M0.3, label: "M0.3 HEAT" }
    - id: 6
      caption: "600 unlatch high"
      series:
        - { kind: contact, tag: M0.1, label: "M0.1 SP600", sense: "NO" }
        - { kind: cmp, op: "≥", left: AI, right_from: ai_603 }
      output: { kind: otu, tag: M0.3, label: "M0.3 HEAT" }
    - id: 7
      caption: "800 latch low"
      series:
        - { kind: contact, tag: I0.0, label: "I0.0 S1", sense: "NO" }
        - { kind: contact, tag: M0.2, label: "M0.2 SP800", sense: "NO" }
        - { kind: cmp, op: "≤", left: AI, right_from: ai_796 }
      output: { kind: otl, tag: M0.3, label: "M0.3 HEAT" }
    - id: 8
      caption: "800 unlatch high"
      series:
        - { kind: contact, tag: M0.2, label: "M0.2 SP800", sense: "NO" }
        - { kind: cmp, op: "≥", left: AI, right_from: ai_804 }
      output: { kind: otu, tag: M0.3, label: "M0.3 HEAT" }
    - id: 9
      caption: SLOW AO 2 kW
      series:
        - { kind: contact, tag: M0.3, label: "M0.3 HEAT", sense: "NO" }
        - { kind: contact, tag: I0.1, label: "I0.1 S2 FAST", sense: "NC" }
      output: { kind: mov, dest: AO, value_from: ao_2kw }
    - id: 10
      caption: FAST AO 8 kW
      series:
        - { kind: contact, tag: M0.3, label: "M0.3 HEAT", sense: "NO" }
        - { kind: contact, tag: I0.1, label: "I0.1 S2 FAST", sense: "NO" }
      output: { kind: mov, dest: AO, value_from: ao_8kw }
    - id: 11
      caption: Display update TON 5 s
      series:
        - { kind: contact, tag: I0.0, label: "I0.0 S1", sense: "NO" }
      output: { kind: ton, tag: T4:0, preset: 5 }
    - id: 12
      caption: Heater enable
      series:
        - { kind: contact, tag: M0.3, label: "M0.3 HEAT", sense: "NO" }
      output: { kind: coil, tag: Q0.0, label: "Q0.0 HEATER_EN" }
