naming:
  cylinder_festo: nA
  cylinder_exam: HCn / HMn
  sensor_retracted: nB1
  sensor_extended: nB2
  solenoid_extend: nY1
  solenoid_retract: nY2
  relay: Kn
  manual_switch: Sn
  lamp: Hn
  l8_example: S1 S2 S3, 1S1 1S2, 1B1 pressure, K1–K4, 1Y1, H1
  S: manually operated pushbutton / input element (S1); limit switch letter is also S
  nS: limit switch of drive n (1S1, 1S2)
  nB: reed, electronic proximity, or pressure switch of drive n (1B1)
  K: relay or contactor (K1)
  nY: solenoid coil of a valve for drive n (1Y1)
  H: indicator / lamp (H1)
  cylinder: nA or HCn
  limit_switch: nSn
  pressure_switch: nBn
l8_p15_examples:
  manually_operated_switches:
  - S1
  - S2
  - S3
  limit_switches:
  - 1S1
  - 1S2
  pressure_switch: 1B1
  relays:
  - K1
  - K2
  - K3
  - K4
  solenoid_coil: 1Y1
  lamp: H1
drawing_law:
  source:
    pdf: MCL431_L8_ElectropneumaticCircuitGuidelines.pdf
    page: 11
  coils_beneath_contacts: true
  symbols_top_to_bottom_left_to_right: true
  numbered_current_paths: true
  control_then_main: true
  contact_element_table_under_coil: true
  sheet_deenergized: true
  actuated_limit_switch_marked_with_arrow: true
  notes:
  - 'L8 p11: relay coils and valve coils are always drawn beneath the contacts'
  - 'L8 p12: current paths drawn alongside each other and numbered consecutively; example paths 1–8 control,
    9–10 main'
  - 'L8 p16–19: terminal function numbers; extra contacts get a sequence prefix (K1: A1/A2, 11/14, 21/24)'
  - 'L8 p20: contact element table sits beneath the current path that contains the relay coil'
  - 'L8 p23: electrical circuit diagram is shown in the de-energized state; actuated limit switches marked
    with an arrow'
